[project]
name = "cua"
version = "0.1.0"
description = "Computer-use automation: LLM discovery -> capability artifact -> deterministic replay, with human handoff"
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.49",
    "openai>=1.50",
    "pydantic>=2.8",
    "typer>=0.12",
    "flask>=3.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-timeout>=2.3"]

[project.scripts]
cua = "cua.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cua", "mockbank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
